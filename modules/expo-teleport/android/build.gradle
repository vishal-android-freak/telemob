plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.naarang.telemob.teleport'
version = '0.1.0'

android {
  namespace "com.naarang.telemob.teleport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation files('libs/teleportmobile.aar')
  implementation 'androidx.credentials:credentials:1.6.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}
