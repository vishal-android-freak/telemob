name: Mobile release

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android and iOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set release metadata
        id: release
        run: node scripts/configure-release.mjs "$GITHUB_REF_NAME" --write

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/teleportmobile/go.mod
          cache-dependency-path: go/teleportmobile/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm run test:go

      - name: Require Expo token
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "The EXPO_TOKEN repository secret is required for signed tag builds." >&2
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android on EAS
        run: |
          eas build \
            --platform android \
            --profile "${{ steps.release.outputs.android_profile }}" \
            --non-interactive \
            --wait \
            --json > eas-build-android.json

      - name: Verify Android ABIs and 16 KB page alignment
        run: |
          telemob_android_url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const parsed = JSON.parse(readFileSync("eas-build-android.json", "utf8"));
            const build = Array.isArray(parsed) ? parsed[0] : parsed;
            const url = build.artifacts?.buildUrl ?? build.artifacts?.applicationArchiveUrl;
            if (!url) throw new Error("The Android EAS build did not return an artifact URL.");
            process.stdout.write(url);
          ')"
          curl --fail --location --silent --show-error \
            "${telemob_android_url}" \
            --output "${RUNNER_TEMP}/telemob.aab"
          bash scripts/verify-android-native-libs.sh "${RUNNER_TEMP}/telemob.aab"

      - name: Build and submit iOS beta on EAS
        if: steps.release.outputs.prerelease == 'true'
        run: |
          eas build \
            --platform ios \
            --profile "${{ steps.release.outputs.ios_profile }}" \
            --auto-submit-with-profile testflight \
            --non-interactive \
            --wait \
            --json > eas-build-ios.json

      - name: Build stable iOS on EAS
        if: steps.release.outputs.prerelease != 'true'
        run: |
          eas build \
            --platform ios \
            --profile "${{ steps.release.outputs.ios_profile }}" \
            --non-interactive \
            --wait \
            --json > eas-build-ios.json

      - name: Combine EAS build metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const builds = ['eas-build-android.json', 'eas-build-ios.json']
            .flatMap(path => {
              const parsed = JSON.parse(readFileSync(path, 'utf8'));
              return Array.isArray(parsed) ? parsed : [parsed];
            });

          writeFileSync('eas-builds.json', `${JSON.stringify(builds, null, 2)}\n`);
          NODE

      - name: Add EAS builds to job summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ANDROID_PROFILE: ${{ steps.release.outputs.android_profile }}
          RELEASE_IOS_PROFILE: ${{ steps.release.outputs.ios_profile }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const parsed = JSON.parse(readFileSync('eas-builds.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const rows = builds.map(build => {
            const owner = build.project?.ownerAccount?.name;
            const slug = build.project?.slug;
            const dashboard = owner && slug
              ? `https://expo.dev/accounts/${owner}/projects/${slug}/builds/${build.id}`
              : undefined;
            const buildLink = dashboard ? `[${build.id}](${dashboard})` : build.id;
            const artifact = build.artifacts?.buildUrl ?? build.artifacts?.applicationArchiveUrl;
            const artifactLink = artifact ? `[artifact](${artifact})` : 'EAS dashboard';
            return `| ${build.platform} | ${build.status} | ${buildLink} | ${artifactLink} |`;
          });

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              `## Telemob ${process.env.RELEASE_TAG}`,
              '',
              `Android profile: \`${process.env.RELEASE_ANDROID_PROFILE}\``,
              `iOS profile: \`${process.env.RELEASE_IOS_PROFILE}\``,
              '',
              '| Platform | Status | Build | Output |',
              '| --- | --- | --- | --- |',
              ...rows,
              '',
            ].join('\n')
          );
          NODE

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-builds-${{ steps.release.outputs.tag }}
          path: eas-builds.json
          if-no-files-found: error
          retention-days: 90

      - name: Select Android beta build
        if: steps.release.outputs.prerelease == 'true'
        id: android-build
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const parsed = JSON.parse(readFileSync('eas-builds.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const android = builds.find(
            build => String(build.platform).toLowerCase() === 'android'
          );

          if (!android?.id) {
            throw new Error('The completed EAS builds did not include Android.');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `id=${android.id}\n`);
          NODE

      - name: Submit Android beta to Google Play Open testing
        if: steps.release.outputs.prerelease == 'true'
        run: |
          eas submit \
            --platform android \
            --profile play-beta \
            --id "${{ steps.android-build.outputs.id }}" \
            --non-interactive \
            --wait

      - name: Add Play submission to job summary
        if: steps.release.outputs.prerelease == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Google Play Open testing',
              '',
              `Telemob ${process.env.RELEASE_TAG} was submitted to the Play beta track.`,
              '',
            ].join('\n')
          );
          NODE

      - name: Add TestFlight submission to job summary
        if: steps.release.outputs.prerelease == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## Apple TestFlight',
              '',
              `EAS Build handed Telemob ${process.env.RELEASE_TAG} to EAS Submit for TestFlight processing.`,
              '',
            ].join('\n')
          );
          NODE
