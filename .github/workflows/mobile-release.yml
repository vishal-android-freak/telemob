name: Mobile release

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android and iOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set release metadata
        id: release
        run: node scripts/configure-release.mjs "$GITHUB_REF_NAME" --write

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/teleportmobile/go.mod
          cache-dependency-path: go/teleportmobile/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm run lint
          npm run test:go

      - name: Require Expo token
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "The EXPO_TOKEN repository secret is required for signed tag builds." >&2
            exit 1
          fi

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build both mobile platforms on EAS
        run: |
          eas build \
            --platform all \
            --profile "${{ steps.release.outputs.profile }}" \
            --non-interactive \
            --wait \
            --json > eas-builds.json

      - name: Add EAS builds to job summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PROFILE: ${{ steps.release.outputs.profile }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const parsed = JSON.parse(readFileSync('eas-builds.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : [parsed];
          const rows = builds.map(build => {
            const owner = build.project?.ownerAccount?.name;
            const slug = build.project?.slug;
            const dashboard = owner && slug
              ? `https://expo.dev/accounts/${owner}/projects/${slug}/builds/${build.id}`
              : undefined;
            const buildLink = dashboard ? `[${build.id}](${dashboard})` : build.id;
            const artifact = build.artifacts?.buildUrl ?? build.artifacts?.applicationArchiveUrl;
            const artifactLink = artifact ? `[artifact](${artifact})` : 'EAS dashboard';
            return `| ${build.platform} | ${build.status} | ${buildLink} | ${artifactLink} |`;
          });

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              `## Telemob ${process.env.RELEASE_TAG}`,
              '',
              `EAS profile: \`${process.env.RELEASE_PROFILE}\``,
              '',
              '| Platform | Status | Build | Output |',
              '| --- | --- | --- | --- |',
              ...rows,
              '',
            ].join('\n')
          );
          NODE

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-builds-${{ steps.release.outputs.tag }}
          path: eas-builds.json
          if-no-files-found: error
          retention-days: 90
