name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/teleportmobile/go.mod
          cache-dependency-path: go/teleportmobile/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test Go core
        run: npm run test:go

      - name: Test connection recovery
        run: npm run test:network

      - name: Test terminal workspace limits
        run: npm run test:terminal

  android-native:
    name: Compile Android native module
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EAS_BUILD_PLATFORM: android
      TELEMOB_ANDROID_ABIS: arm64-v8a

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build native dependencies
        run: npm run eas-build-pre-install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Expo Teleport module
        working-directory: android
        run: ./gradlew :expo-teleport:compileReleaseKotlin -PreactNativeArchitectures=arm64-v8a

  ios-native:
    name: Compile iOS native module
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EAS_BUILD_PLATFORM: ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.4
          cache-dependency-path: go/teleportmobile/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build native dependencies
        run: npm run eas-build-pre-install

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install iOS pods
        run: pod install --project-directory=ios

      - name: Compile Telemob for iOS devices
        run: >-
          xcodebuild
          -workspace ios/Telemob.xcworkspace
          -scheme Telemob
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
